name: Awesome God Radar

on:
  schedule:
    # GitHub Actions ne garantit pas une exécution exactement à la minute,
    # mais cette programmation demande un passage toutes les 5 minutes.
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # RÉCUPÉRATION DU CODE
      # --------------------------------------------------

      - name: Récupérer le code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # PYTHON
      # --------------------------------------------------

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # DÉPENDANCES
      # --------------------------------------------------

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # --------------------------------------------------
      # BLIENTELE
      # Surveillance prioritaire
      # + préparation du cart automatique
      # --------------------------------------------------

      - name: Scanner Blientele
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python blientele_cart.py

      # --------------------------------------------------
      # SAUCONY
      # --------------------------------------------------

      - name: Scanner Saucony
        run: |
          python saucony_radar.py

      # --------------------------------------------------
      # EQL
      # --------------------------------------------------

      - name: Scanner EQL
        run: |
          python eql_radar.py

      # --------------------------------------------------
      # WESTSIDE GUNN
      # --------------------------------------------------

      - name: Scanner Westside Gunn
        run: |
          python westside_radar.py

      # --------------------------------------------------
      # RADAR CENTRAL + TELEGRAM
      # --------------------------------------------------

      - name: Lancer le radar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      # --------------------------------------------------
      # SAUVEGARDE DES MÉMOIRES
      # --------------------------------------------------

      - name: Sauvegarder les mémoires
        run: |
          git config user.name "Awesome God Radar"
          git config user.email "actions@github.com"

          git add \
            seen.json \
            westside_seen.json \
            westside_alerts.json \
            blientele_cart_seen.json

          if git diff --cached --quiet; then
            echo "ℹ️ Aucun changement de mémoire à sauvegarder."
          else
            git commit -m "Update radar memory"
            git push
          fi
